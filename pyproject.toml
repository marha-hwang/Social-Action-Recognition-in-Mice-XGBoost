[project]
name = "kaggle-mice"
version = "0.1.0"
description = ""
authors = [
    {name = "marha-hwang",email = "hwangharam@naver.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "pyarrow (>=18.0.0)",
    "ipykernel (>=7.1.0,<8.0.0)",
    "polars (>=1.35.2,<2.0.0)",
    "xgboost (>=3.1.1,<4.0.0)",
    "optuna (>=4.6.0,<5.0.0)",
    "joblib (>=1.5.2,<2.0.0)",
    "koolbox (>=0.1.3,<0.2.0)"
]

[tool.poetry]
packages = [{include = "kaggle_mice", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
